{{- $redis := include "ecom-api.redis.connection" . -}}
{{- if $redis }}
# The Redis connection string can carry a password for an external instance, so it is kept out of the ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecom-api.api.fullname" . }}
  labels:
    {{- include "ecom-api.labels" . | nindent 4 }}
    {{- include "ecom-api.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  Cache__RedisConnection: {{ $redis | quote }}
{{- end }}
