apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ecom-api.api.fullname" . }}-data
  labels:
    {{- include "ecom-api.labels" . | nindent 4 }}
    {{- include "ecom-api.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    # Keep the SQLite databases when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.api.persistence.accessMode }}
  {{- with .Values.api.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
