# Single-binary Tempo for Docker Compose, storing traces on the local filesystem.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Derives RED metrics per span and the service graph from the traces and remote-writes them
# to Prometheus. Grafana's Tempo service map and span metrics tabs use them.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 168h
    metrics_generator:
      processors: [span-metrics, service-graphs]
      generate_native_histograms: classic

usage_report:
  reporting_enabled: false
