services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: ecom-kafka
    ports:
      # Host access for local development (`dotnet run` with EventBus__Provider=Kafka)
      - "9094:9094"
    environment:
      # Single-node KRaft cluster (broker + controller, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the API with the configured partition count
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    ports:
      # Host access for local development (`dotnet run` with Cache__Provider=Redis)
      - "6379:6379"
    # Append-only file so cached entries survive a restart; bounded memory with LRU eviction
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---- Observability: the API → OpenTelemetry Collector → Tempo / Prometheus / Loki → Grafana ----

  otel-collector:
    # Single OTLP endpoint for traces, metrics and logs; routes each signal to its backend
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: ecom-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"     # OTLP/gRPC (host access for `dotnet run` with Telemetry__*__Enabled=true)
      - "4318:4318"     # OTLP/HTTP
    volumes:
      - ./deploy/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    # Trace storage; also derives span metrics and the service graph into Prometheus
    image: grafana/tempo:3.0.3
    container_name: ecom-tempo
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  loki:
    # Log storage; receives OTLP logs from the collector
    image: grafana/loki:3.7.8
    container_name: ecom-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  prometheus:
    # Metrics storage and alert rules (shared with the Helm chart's PrometheusRule)
    image: prom/prometheus:v3.15.0
    container_name: ecom-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # span metrics from Tempo
      - --enable-feature=exemplar-storage    # trace ids on latency histograms
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Directory mounts (not single files) so edits on the host are picked up
      - ./deploy/helm/ecom-api/files:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  kafka-exporter:
    # Consumer group lag and topic offsets for Prometheus
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: ecom-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    # Dashboards and exploration; data sources and the eComAPI dashboard are provisioned
    image: grafana/grafana:13.2.2
    container_name: ecom-grafana
    ports:
      - "3000:3000"
    environment:
      # Local development only: open access as Admin, no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/ecom-api/files:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  ecomapi:
    build:
      context: ./EcomAPI
      dockerfile: Dockerfile
    image: ecomapi:latest
    container_name: ecomapi
    ports:
      - "5025:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__WriteDbConnection: "Data Source=/app/data/Write.db"
      ConnectionStrings__ReadDbConnection: "Data Source=/app/data/Read.db"
      EventBus__Provider: Kafka
      Kafka__BootstrapServers: kafka:9092
      Cache__Provider: Redis
      Cache__RedisConnection: redis:6379
      Telemetry__OtlpEndpoint: http://otel-collector:4317
      Telemetry__Tracing__Enabled: "true"
      Telemetry__Metrics__Enabled: "true"
      Telemetry__Logs__Enabled: "true"
    volumes:
      - ecom-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: unless-stopped

volumes:
  ecom-data:
  kafka-data:
  redis-data:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
